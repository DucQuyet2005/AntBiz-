<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cấp quyền Microphone - AntBiz Assistant</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 32px;
      width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h2 {
      margin-top: 0;
      color: #4f46e5;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #4b5563;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #4f46e5;
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(79, 70, 229, 0.15);
      transition: all 0.15s ease;
    }
    .btn:hover {
      background-color: #4338ca;
      transform: translateY(-1px);
    }
    .success-box {
      color: #10b981;
      font-weight: 600;
      display: none;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h2>Cấp quyền Microphone</h2>
    <p>Tiện ích AntBiz Assistant cần quyền truy cập microphone của bạn để thực hiện chức năng dịch giọng nói thành văn bản.</p>
    <button id="btn-request" class="btn">Cấp quyền Microphone</button>
    <div id="success-message" class="success-box">✓ Cấp quyền thành công! Đang tự động đóng tab...</div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
