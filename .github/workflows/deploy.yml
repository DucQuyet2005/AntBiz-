name: Deploy to AntBiz- VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy AntBiz- SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          key_type: base64
          script: |
            cd /var/www/AntBiz-
            git pull origin main
            npm install
            npm run build
            pm2 restart antbiz